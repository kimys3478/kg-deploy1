<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KIGLE Excavation · 원석 발굴 기록</title>
  <meta name="description" content="기록되지 않은 원석이 발견되었다. 여덟 개의 층을 분석하며 만나는 KIGLE과 Global 팀 이야기.">
  <meta name="theme-color" content="#050505">

  <!-- 링크 공유 미리보기 (카카오톡·슬랙·페이스북 등) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="KIGLE Excavation">
  <meta property="og:title" content="KIGLE Excavation · 원석 발굴 기록">
  <meta property="og:description" content="37°29'06.7&quot;N 126°59'44.5&quot;E, 기록되지 않은 원석이 발견되었다. 여덟 개의 층을 분석하며 만나는 KIGLE과 Global 팀 이야기.">
  <meta property="og:url" content="https://kimys3478.github.io/kg-deploy1/">
  <meta property="og:image" content="https://kimys3478.github.io/kg-deploy1/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="KIGLE Excavation — 렌더 패스 창들이 쌓인 원석 분석 화면">
  <meta property="og:locale" content="ko_KR">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="KIGLE Excavation · 원석 발굴 기록">
  <meta name="twitter:description" content="기록되지 않은 원석이 발견되었다. 여덟 개의 층을 분석하며 만나는 KIGLE과 Global 팀 이야기.">
  <meta name="twitter:image" content="https://kimys3478.github.io/kg-deploy1/og-image.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;800;900&family=JetBrains+Mono:wght@300;400;700&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
  </script>
</head>
<body>

  <!-- 3D 씬 (최종 렌더 · 세계) -->
  <canvas id="scene" aria-hidden="true"></canvas>

  <!-- 렌더 패스 창 -->
  <div id="windows" aria-hidden="true"></div>

  <!-- 인트로: 발굴 기록 -->
  <section id="intro" aria-label="인트로">
    <svg id="outline" viewBox="0 0 400 600" preserveAspectRatio="xMidYMid meet"><path/></svg>
    <div class="intro__text mono">
      <p class="intro__coord"><span data-type="coord"></span><i class="caret"></i></p>
      <p class="intro__quote"><span data-type="quote"></span></p>
    </div>
  </section>

  <!-- 전설 한 줄 -->
  <p id="legend" class="kr"></p>

  <!-- 섹션: 제목 링 + 설명 -->
  <section id="sections" aria-live="polite">
    <div class="ground" aria-hidden="true"></div>
    <div class="info">
      <p class="info__sub mono"><span data-info="no"></span> — <span data-info="part"></span></p>
      <p class="info__kind mono" data-info="kind"></p>
      <p class="info__myth kr" data-info="myth"></p>
      <p class="info__team kr" data-info="team"></p>
    </div>
    <div class="ring" id="ring"></div>
  </section>

  <!-- 피날레 -->
  <div id="flash" aria-hidden="true"></div>
  <p id="finale" class="kr"></p>

  <!-- 고정 HUD -->
  <header class="hud hud--top">
    <a class="brand" href="#" aria-label="처음으로">KIGLE<span class="mono">Excavation Record</span></a>
    <p class="mono hud__right"><span id="specimen"></span><br><span id="step" class="hud__step"></span></p>
  </header>
  <footer class="hud hud--bottom mono">
    <p id="coord" class="hud__coord"></p>
    <div class="hud__progress"><span id="hint">SCROLL TO EXCAVATE ↓</span><i><b id="bar"></b></i></div>
  </footer>

  <noscript><p style="color:#fff;padding:24px">이 페이지는 JavaScript와 WebGL이 필요해요.</p></noscript>
  <script type="module" src="main.js"></script>
</body>
</html>
